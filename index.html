const BANK={"radar":[{"id":"r4-01","tag":"E-mail e contexto","type":"email","module":"radar","stage":0,"status":"normal","who":"Biblioteca","address":"avisos@biblioteca-escolar.example","subject":"Prazo de empréstimo","premise":"Você abriu o aplicativo conhecido da biblioteca por conta própria; ele mostra o mesmo prazo.","text":"Último aviso: devolva o livro até sexta para evitar uma multa. Confira o prazo no aplicativo como de costume.","ask":"Qual descrição melhor resume este cenário?","options":["Contexto conhecido, sem ação sensível","Há uma dúvida; confirmar por outro canal","Pedido arriscado; recusar a ação proposta"],"correct":0,"why":"O prazo coincide com o aplicativo que você abriu por conta própria e não há pedido de dados ou pagamento. Você pode tratar como aviso, sem clicar em links inesperados. Conferir por outro canal também é uma opção prudente. Essa classificação não prova a identidade do remetente."},{"id":"r4-02","tag":"E-mail e contexto","type":"email","module":"radar","stage":0,"status":"normal","who":"Equipe da feira","address":"feira@escola-aurora.example","subject":"Materiais do grupo","premise":"Você confirmou pessoalmente com a professora que ela enviaria a lista, sem exigir acesso a uma conta.","text":"Para a feira, tragam papel e lápis. A lista completa foi entregue na sala.","ask":"Qual descrição melhor resume este cenário?","options":["Contexto conhecido, sem ação sensível","Há uma dúvida; confirmar por outro canal","Pedido arriscado; recusar a ação proposta"],"correct":0,"why":"O contexto foi confirmado e o texto não exige senha, código ou pagamento. Basta considerar o recado; o nome do remetente, sozinho, não prova autenticidade. Conferir por outro canal também é uma opção prudente. Essa classificação não prova a identidade do remetente."},{"id":"r4-03","tag":"E-mail e contexto","type":"email","module":"radar","stage":0,"status":"normal","who":"Oficina de artes","address":"oficina@centro-comunitario.example","subject":"Lembrete do enco da diz que amanhã não haverá aula. Não há autoria, data ou comunicado anexado.","ask":"Qual é o próximo passo?","options":["Consultar o canal conhecido da escola","Repassar o aviso recebido no grupo"],"correct":0,"why":"Um aviso sobre a escola deve ser conferido com a própria escola. Repetição não equivale a confirmação independente.","type":"message","module":"fonte"},{"id":"fonte-03","tag":"Opinião","who":"Comentário sobre um jogo","text":"Uma pessoa escreve: “Este é o jogo mais divertido do ano”. Não apresenta critérios de avaliação.","ask":"Como classificar essa frase?","options":["É uma avaliação pessoal","É um fato universal provado"],"correct":0,"why":"“Mais divertido” expressa uma avaliação. Opiniões podem ser discutidas, mas não viram fatos universais por terem muitos apoios.","type":"message","module":"fonte"},{"id":"fonte-04","tag":"Afirmação verificável","who":"Aviso de evento","text":"Um cartaz diz: “A feira de ciências começará às 9h na sexta-feira”.","ask":"Que tipo de informação é essa?","options":["É verificável, mas precisa ser conferida","É verdadeira, pois está impressa"],"correct":0,"why":"Data e horário podem ser verificados. Ser uma afirmação factual não significa que sua correção já foi confirmada.","type":"message","module":"fonte"},{"id":"fonte-05","tag":"Popularidade","who":"Vídeo viral","text":"Um vídeo com milhares de curtidas afirma que uma regra escolar mudou, mas não mostra a origem da informação.","ask":"O que as curtidas demonstram?","options":["Mostram alcance, não confirmação","Mostram prova da informação"],"correct":0,"why":"Popularidade mede circulação ou reação. Para conferir uma regra, procure o documento ou a instituição responsável.","type":"message","module":"fonte"},{"id":"fonte-06","tag":"Perfil verificado","who":"Conta de notícias","text":"Um perfil com selo publica uma informação surpreendente sem indicar documento ou reportagem.","ask":"Qual é a atitude crítica?","options":["Verificar origem e evidências","Confiar no selo do perfil"],"correct":0,"why":"Um selo não verifica cada afirmação feita pelo perfil. Identidade da conta e qualidade da informação são questões diferentes.","type":"message","module":"fonte"},{"id":"fonte-07","tag":"Independência","who":"Três páginas","text":"Três páginas repetem a mesma notícia. Todas apontam para uma única postagem anônima.","ask":"Quantas confirmações independentes foram demonstradas?","options":["Não há confirmação independente","Há três confirmações independentes"],"correct":0,"why":"Muitos textos podem depender da mesma fonte. Procure evidências independentes, não apenas cópias da mesma alegação.","type":"message","module":"fonte"},{"id":"fonte-08","tag":"Fonte primária","who":"Regulamento de torneio","text":"Uma postagem resume as regras do torneio. O organizador publicou o regulamento completo e atualizado.","ask":"Onde conferir as regras?","options":["Ler o regulamento do organizador","Ler apenas comentários do público"],"correct":0,"why":"Para saber a regra vigente, o documento do responsável é a referência direta. Leia a versão e a data, não só um recorte.","type":"message","module":"fonte"},{"id":"fonte-09","tag":"Captura de tela","who":"Suposta reportagem","text":"Um print mostra o nome de um jornal conhecido, mas não tem link, data ou contexto.","ask":"Qual é o melhor passo?","options":["Buscar a reportagem no veículo","Confiar no nome mostrado no print"],"correct":0,"why":"Um cartão ou print pode ser editado. Confirme se o conteúdo existe no veículo e se título, data e contexto correspondem.","type":"message","module":"fonte"},{"id":"fonte-10","tag":"Relato pessoal","who":"Mensagem de uma amiga","text":"Uma amiga conta: “Hoje eu fiquei nervosa antes da apresentação”.","ask":"Qual resposta faz sentido?","options":["Acolher e perguntar como ela está","Exigir uma notícia sobre a emoção"],"correct":0,"why":"Relatos sobre experiências próprias pedem escuta e contexto. Isso é diferente de repetir uma alegação pública sobre outras pessoas ou instituições.","type":"message","module":"fonte"},{"id":"fonte-11","tag":"Boato de saúde","who":"Mensagem encaminhada","text":"Uma mensagem promete curar uma doença com uma receita e pede que você abandone o tratamento. Não cita evidências.","ask":"Como agir?","options":["Buscar orientação de fonte de saúde","Seguir a receita do grupo online"],"correct":0,"why":"Afirmações de saúde podem causar danos. Uma mensagem sem evidências não substitui orientação profissional; não altere tratamento por conta própria.","type":"message","module":"fonte"},{"id":"fonte-12","tag":"Publicidade","who":"Post de influenciador","text":"Um criador recebe pagamento para divulgar um produto e diz: “É o melhor de todos”.","ask":"O que considerar?","options":["Analisar o interesse e as evidências","Confiar na fama e na divulgação"],"correct":0,"why":"Identifique quem ganha com a mensagem. Interesse comercial não prova falsidade, mas precisa entrar na avaliação do conteúdo.","type":"message","module":"fonte"},{"id":"fonte-13","tag":"Sátira","who":"Página de humor","text":"Uma página identificada como sátira publica uma manchete absurda. Um perfil recorta a manchete e retira a identificação de humor.","ask":"Qual é o problema do recorte?","options":["O recorte omite o contexto de humor","O recorte comprova a notícia integral"],"correct":0,"why":"O gênero do conteúdo faz parte do contexto. Uma piada deslocada pode circular como alegação factual.","type":"message","module":"fonte"},{"id":"fonte-14","tag":"Título e conteúdo","who":"Link de notícia","text":"O título parece dizer que todas as escolas fecharão. O texto trata de uma unidade específica durante uma manutenção.","ask":"Qual conclusão é sustentada?","options":["A notícia trata de uma única unidade","A notícia trata de todas as unidades"],"correct":0,"why":"Leia além do título. Uma informação sobre um caso particular não autoriza uma conclusão sobre todas as unidades.","type":"message","module":"fonte"},{"id":"fonte-15","tag":"Imagem de IA","who":"Imagem impressionante","text":"Uma imagem muito realista mostra um acontecimento, mas não há autoria, data, local ou registros de origem disponíveis.","ask":"O que é adequado concluir?","options":["Faltam dados para confirmar a imagem","A imagem realista comprova o evento"],"correct":0,"why":"A inspeção visual tem limites. Busque procedência e registros confiáveis; ausência de defeitos não comprova autenticidade.","type":"message","module":"fonte"},{"id":"fonte-16","tag":"Correção responsável","who":"Você compartilhou","text":"Você repassou um aviso e depois confirmou que ele estava desatualizado.","ask":"Como reparar?","options":["Corrigir no grupo e indicar a fonte","Apagar sem esclarecer para o grupo"],"correct":0,"why":"Corrigir ajuda a interromper a circulação. Faça a atualização chegar ao público que recebeu a informação anterior, sem humilhar outras pessoas.","type":"message","module":"fonte"},{"id":"fonte-17","tag":"Autoria","who":"Trabalho escolar","text":"Você encontrou uma explicação útil e quer usá-la no seu material.","ask":"Qual é a prática adequada?","options":["Citar a fonte e explicar com suas palavras","Copiar o texto e omitir a sua origem"],"correct":0,"why":"Uso ético inclui atribuição e respeito às condições de uso. Uma fonte deve poder ser encontrada por quem lê seu trabalho.","type":"message","module":"fonte"},{"id":"fonte-18","tag":"Privacidade","who":"Print de uma conversa","text":"Um print com nome e telefone de um colega circula junto de uma acusação não verificada.","ask":"Qual é a atitude responsável?","options":["Proteger a privacidade e buscar ajuda","Repassar o print para buscar respostas"],"correct":0,"why":"Uma acusação incerta não autoriza expor dados ou promover ataques. Preserve a privacidade e busque ajuda responsável.","type":"message","module":"fonte"},{"id":"fonte-19","tag":"Citação incompleta","who":"Fala recortada","text":"Um vídeo curto mostra alguém dizendo “não precisamos estudar”. Na gravação completa, a fala era: “É errado dizer que não precisamos estudar”.","ask":"O que mudou?","options":["O trecho mudou o sentido da fala","O trecho manteve o sentido da fala"],"correct":0,"why":"Recortes podem retirar negações, perguntas e explicações. Consulte o trecho completo antes de atribuir uma posição a alguém.","type":"message","module":"fonte"},{"id":"fonte-20","tag":"Pesquisa limitada","who":"Enquete","text":"Oito colegas de uma turma responderam uma enquete. A postagem anuncia: “Todos os jovens do país pensam assim”.","ask":"Qual é o problema?","options":["A amostra não representa todo o país","A amostra representa todo o país"],"correct":0,"why":"Observe quem foi ouvido, quantas pessoas e como foram escolhidas. Números não resolvem limitações de amostragem.","type":"message","module":"fonte"},{"id":"fonte-21","tag":"Gráfico","who":"Comparação visual","text":"Um gráfico corta o eixo vertical e faz uma pequena diferença parecer enorme. Os valores estão disponíveis.","ask":"O que deve ser examinado?","options":["Examinar escala, números e contexto","Examinar título, cores e aparência"],"correct":0,"why":"Uma visualização pode exagerar uma diferença sem alterar os números. Confira escala, unidade e período.","type":"message","module":"fonte"},{"id":"fonte-22","tag":"Busca e anúncio","who":"Resultado de pesquisa","text":"O primeiro resultado da busca é um anúncio sobre inscrições e pede pagamento.","ask":"Estar em primeiro lugar garante o quê?","options":["O anúncio não garante canal oficial","O anúncio garante canal oficial"],"correct":0,"why":"Posição na busca e publicidade não comprovam legitimidade. Confira o canal conhecido da instituição.","type":"message","module":"fonte"},{"id":"fonte-23","tag":"Fonte identificável","who":"Post sem referência","text":"Uma postagem afirma “cientistas comprovaram”, mas não informa estudo, autores ou instituição.","ask":"Qual pergunta ajuda a verificar?","options":["Pedir o estudo e consultar a origem","Contar as curtidas e aceitar o texto"],"correct":0,"why":"A expressão “cientistas comprovaram” não é uma referência. Procure material identificável e avalie o que ele realmente conclui.","type":"message","module":"fonte"},{"id":"fonte-24","tag":"Limite da evidência","who":"Pesquisa inicial","text":"Um resumo diz que um resultado foi observado em um teste de laboratório. Um post afirma que já funciona para todas as pessoas.","ask":"O que há de errado?","options":["O post amplia a conclusão do teste","O post respeita a conclusão do teste"],"correct":0,"why":"Método, condições e limites importam. Um resultado inicial não sustenta automaticamente uso universal.","type":"message","module":"fonte"},{"id":"fonte-25","tag":"Emoção","who":"Texto alarmante","text":"Uma mensagem começa com “ESTÃO ESCONDENDO ISSO DE VOCÊ!” e manda compartilhar antes de ler.","ask":"Qual é a melhor reação?","options":["Pausar e verificar antes de repassar","Repassar e verificar depois de enviar"],"correct":0,"why":"Emoção pode ser usada para acelerar compartilhamentos. Ela não prova verdade ou falsidade; é um convite para verificar com calma.","type":"message","module":"fonte"},{"id":"fonte-26","tag":"Conta oficial","who":"Perfil de evento","text":"Um perfil usa “OFICIAL” no nome. Você quer confirmar se pertence ao organizador.","ask":"Qual evidência ajuda mais?","options":["O site conhecido indica esse perfil","O próprio perfil diz que é oficial"],"correct":0,"why":"Uma ligação a partir do site conhecido ajuda a confirmar a identidade. Um perfil falso também pode colocar um link para um site verdadeiro na própria descrição.","type":"message","module":"fonte"},{"id":"fonte-27","tag":"Antes de concluir","who":"Checagem inconclusiva","text":"Você buscou a origem de uma alegação e não conseguiu confirmá-la nem refutá-la.","ask":"Qual conclusão é responsável?","options":["Dizer que ainda não foi confirmada","Dizer que já foi provada como falsa"],"correct":0,"why":"Não encontrar confirmação não é o mesmo que provar falsidade. Reconhecer a incerteza é parte da checagem.","type":"message","module":"fonte"},{"id":"fonte-28","tag":"Foto e legenda","who":"Registro de evento","text":"Uma foto real mostra uma praça cheia. A legenda afirma que todas as pessoas apoiam uma proposta, mas não apresenta entrevistas ou levantamento.","ask":"O que a imagem sustenta?","options":["A foto mostra pessoas reunidas","A foto prova a opinião de todas"],"correct":0,"why":"Separe o que aparece no registro da interpretação adicionada. Uma foto não revela automaticamente motivos ou opiniões de todos.","type":"message","module":"fonte"},{"id":"fonte-29","tag":"Relato e generalização","who":"Comentário sobre aplicativo","text":"Uma pessoa diz: “No meu celular, o aplicativo travou uma vez. Portanto ele nunca funciona para ninguém”.","ask":"Como avaliar?","options":["Um relato não prova o caso de todos","Um relato prova o caso de todos"],"correct":0,"why":"Um relato individual pode ser relevante sem sustentar uma conclusão universal. Procure dados e outras evidências para generalizar.","type":"message","module":"fonte"},{"id":"fonte-30","tag":"Informação atualizada","who":"Edital de inscrição","text":"Você encontra um edital antigo e outro mais recente, publicado pelo organizador, que prorroga as inscrições.","ask":"O que fazer?","options":["Ler a atualização do organizador","Ler apenas o edital mais antigo"],"correct":0,"why":"Informações podem ser atualizadas legitimamente. Verifique versão, data e eventuais retificações no canal responsável.","type":"message","module":"fonte"},{"id":"fonte-31","tag":"Verificação sem exposição","who":"Boato sobre aluno","text":"Um grupo quer descobrir se um boato pessoal é verdade e propõe interrogar publicamente o colega.","ask":"Qual é a decisão ética?","options":["Preservar a privacidade e pedir apoio","Expor a pessoa para obter respostas"],"correct":0,"why":"Letramento informacional não autoriza invasão de privacidade. Situações pessoais exigem cuidado, consentimento e apoio responsável.","type":"message","module":"fonte"},{"id":"fonte-32","tag":"Intenção da mensagem","who":"Convite para compartilhar","text":"Uma postagem diz: “Se você é uma boa pessoa, repasse para dez grupos”. Não apresenta fonte para sua alegação.","ask":"Qual estratégia está sendo usada?","options":["Há pressão, mas faltam evidências","Há evidências na pressão do texto"],"correct":0,"why":"Apelos à culpa e à identidade podem incentivar circulação sem checagem. Sua responsabilidade é avaliar o conteúdo, não obedecer à corrente.","type":"message","module":"fonte"}],"chat":[{"id":"chat-01","tag":"Relato e informação","type":"chat","module":"fonte","who":"Lia","text":"Fiquei nervosa antes da apresentação de hoje.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Lia está contando como se sentiu. Acolher e perguntar é diferente de exigir uma notícia para provar sua emoção."},{"id":"chat-02","tag":"Relato e informação","type":"chat","module":"fonte","who":"Lia","text":"Disseram no grupo que amanhã não haverá aula.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"O contato está repassando uma informação sem origem. Confira a decisão no canal conhecido da escola."},{"id":"chat-03","tag":"Relato e informação","type":"clip","module":"fonte","who":"Caio","text":"Gostei mais da minha maquete depois que mudei a iluminação.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Caio descreve sua opinião sobre o próprio trabalho. Você pode ouvi-lo sem tratá-la como uma regra para todos."},{"id":"chat-04","tag":"Relato e informação","type":"clip","module":"fonte","who":"Caio","text":"Vi alguém dizendo que a biblioteca vai fechar de vez.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"A frase é uma informação repassada sem documento. Procure a posição da própria biblioteca e sua data."},{"id":"chat-05","tag":"Relato e informação","type":"chat","module":"fonte","who":"Nina","text":"Perdi meu caderno no caminho para a aula.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Nina relata algo que aconteceu com ela. Acolha e, se necessário, pergunte por mais detalhes."},{"id":"chat-06","tag":"Relato e informação","type":"chat","module":"fonte","who":"Nina","text":"Um vídeo falou que mudaram todas as regras do torneio.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"O vídeo não identifica o regulamento. Vá ao organizador e leia o documento vigente."},{"id":"chat-07","tag":"Relato e informação","type":"clip","module":"fonte","who":"Léo","text":"Minha bateria acabou quando eu ia mandar a mensagem.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Léo está explicando a própria experiência. Não é preciso buscar uma manchete para ouvir o relato."},{"id":"chat-08","tag":"Relato e informação","type":"clip","module":"fonte","who":"Léo","text":"Ouvi dizer que o ônibus escolar foi cancelado a semana inteira.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"Ouvir de outra pessoa não confirma o aviso. Confira com o responsável pelo transporte por um canal conhecido."},{"id":"chat-09","tag":"Relato e informação","type":"chat","module":"fonte","who":"Bia","text":"Hoje me senti deixada de lado no grupo.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Bia relata um sentimento pessoal. Escute com respeito e evite exigir uma prova pública do que sentiu."},{"id":"chat-10","tag":"Relato e informação","type":"chat","module":"fonte","who":"Bia","text":"Uma postagem diz que a feira de ciências foi cancelada.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"Uma postagem sem origem não confirma o cancelamento. Confira a informação com a organização."},{"id":"chat-11","tag":"Relato e informação","type":"clip","module":"fonte","who":"Davi","text":"Achei o livro difícil, mas terminei ontem.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Davi está descrevendo sua experiência e opinião, não comprovando que o livro é difícil para todos."},{"id":"chat-12","tag":"Relato e informação","type":"clip","module":"fonte","who":"Davi","text":"Um perfil diz que o parque do bairro vai fechar amanhã.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"O perfil repete uma alegação. Verifique na administração responsável e busque um aviso datado."},{"id":"chat-13","tag":"Relato e informação","type":"chat","module":"fonte","who":"Rafa","text":"Esqueci minha garrafa no laboratório depois da aula.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Rafa descreve algo que lhe aconteceu. Ouça o relato e ajude a procurar sem transformá-lo em notícia."},{"id":"chat-14","tag":"Relato e informação","type":"chat","module":"fonte","who":"Rafa","text":"Falaram que todas as escolas mudaram seu horário.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"A generalização precisa de evidências. Consulte o comunicado da própria escola e veja seu alcance."},{"id":"chat-15","tag":"Relato e informação","type":"clip","module":"fonte","who":"Malu","text":"No meu teste, a ponte de palitos caiu quando coloquei mais peso.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Malu conta o resultado de seu teste. Você pode perguntar como ele foi feito, sem supor que vale para toda ponte."},{"id":"chat-16","tag":"Relato e informação","type":"clip","module":"fonte","who":"Malu","text":"Alguém no vídeo falou que a fonte da praça secou para sempre.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"A gravação e a frase não mostram a origem da conclusão. Procure a fonte responsável e o contexto."},{"id":"chat-17","tag":"Relato e informação","type":"chat","module":"fonte","who":"Enzo","text":"Eu me atrasei porque perdi o ônibus hoje.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Enzo apresenta seu próprio relato. Ouvir não exige encontrar uma reportagem sobre a experiência dele."},{"id":"chat-18","tag":"Relato e informação","type":"chat","module":"fonte","who":"Enzo","text":"Uma mensagem diz que um ingrediente comum cura qualquer gripe.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"Não repasse promessa de cura. Procure orientação de saúde qualificada e não substitua tratamento por mensagem."},{"id":"chat-19","tag":"Relato e informação","type":"clip","module":"fonte","who":"Sara","text":"Fiquei feliz com a apresentação do nosso grupo.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Sara compartilha seu sentimento sobre a apresentação. Ele não é uma afirmação sobre o sentimento de toda a turma."},{"id":"chat-20","tag":"Relato e informação","type":"clip","module":"fonte","who":"Sara","text":"Vi num grupo que a prova foi adiada, mas ninguém mostrou o aviso.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"A mudança de data deve ser confirmada com a escola ou professor por um canal conhecido."},{"id":"chat-21","tag":"Relato e informação","type":"chat","module":"fonte","who":"Lu","text":"Durante meu ensaio, percebi que falei rápido demais.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Lu relata uma observação sobre si. Você pode acolher e conversar sobre como ajudar no próximo ensaio."},{"id":"chat-22","tag":"Relato e informação","type":"chat","module":"fonte","who":"Lu","text":"Um colega ouviu que o clube vai suspender todas as atividades.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"O colega está repetindo algo que ouviu. Consulte o clube para saber se existe uma decisão e quando vale."},{"id":"chat-23","tag":"Relato e informação","type":"clip","module":"fonte","who":"Ivo","text":"Minha planta cresceu dois centímetros desde a semana passada.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Ivo descreve uma medição própria. Perguntar como mediu ajuda a entender sem generalizar para outras plantas."},{"id":"chat-24","tag":"Relato e informação","type":"clip","module":"fonte","who":"Ivo","text":"Um perfil disse que a eleição do grêmio foi cancelada.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":1,"why":"Sem origem identificada, a alegação permanece não confirmada. Procure a comissão responsável."},{"id":"chat-25","tag":"Relato e informação","type":"chat","module":"fonte","who":"Clara","text":"Eu prefiro estudar com o grupo na biblioteca.","ask":"Qual é a melhor reação?","options":["Acolher o relato pessoal","Buscar a origem da notícia"],"correct":0,"why":"Clara apresenta uma preferência pessoal. Ouvir não significa afirmar que a mesma escolha serve a todos."},{"id":"chat-26","tag":"Relato e informação","type":"chat","module":"fonte","who":"Clara","text":"O grupo es ia dentro de uma parte dos participantes; não representam automaticamente toda a turma.","engagement":"310 reações"},{"id":"aprofundar-04","type":"socialdeep","module":"fonte","tag":"Compare evidências","who":"Conexão escolar","text":"Este perfil usa o selo e por isso é o canal oficial do evento.","evidence":"Perfil A: exibe um selo e aponta para o site do evento.\nSite do evento, acessado por um endereço já conhecido: aponta para o perfil B; não menciona o perfil A.","ask":"Qual verificação ajuda mais a confirmar o canal?","options":["O site conhecido aponta para o perfil B","O perfil A aponta para o site do evento","O selo no perfil A comprova a identidade"],"correct":0,"why":"Qualquer perfil pode apontar para um site real. A indicação a partir do site conhecido é uma evidência melhor de identidade, mas não garante a veracidade de todas as postagens.","engagement":"765 reações"},{"id":"aprofundar-05","type":"socialdeep","module":"fonte","tag":"Compare evidências","who":"Observatório da turma","text":"Um experimento inicial prova que este produto cura uma doença.","evidence":"Resumo de pesquisa: um teste pequeno em laboratório observou um efeito em células.\nNota de uma instituição de saúde: o resultado ainda não demonstrou eficácia ou segurança em pessoas.","ask":"Qual conclusão acompanha os limites da evidência?","options":["É um teste inicial, não um tratamento validado","O produto já é um tratamento seguro para pessoas","O teste prova que a pesquisa não tem utilidade"],"correct":0,"why":"Uma observação em laboratório é diferente de demonstrar eficácia e segurança em pessoas. Decisões de saúde exigem orientação profissional.","engagement":"980 reações"},{"id":"aprofundar-06","type":"socialdeep","module":"fonte","tag":"Compare evidências","who":"Mural do bairro","text":"A biblioteca abrirá todo sábado a partir de amanhã.","evidence":"Cartaz compartilhado: fala em abertura aos sábados, sem data de criação.\nAtualização da biblioteca: uma proposta de sábado está em const CASES=[{id:'horta',title:'O boato da horta',claim:'“A escola vai fechar a horta na sexta-feira.”',brief:'Uma postagem está circulando no grupo da turma. Você foi convidado a preparar uma atualização responsável.',sources:[{type:'Publicação que circula',name:'Grupo da turma · sem data',body:'“Ouvi dizer que a horta vai fechar nesta sexta. Compartilhem antes que seja tarde!” Não informa quem decidiu nem apresenta documento.'},{type:'Fonte responsável · simulação',name:'Aviso da coordenação · 12 de maio',body:'“A horta ficará fechada para manutenção de 16 a 18 de maio e reabrirá em 19 de maio.” O aviso não fala em fechamento definitivo.'},{type:'Outra evidência · simulação',name:'Calendário do projeto · 12 de maio',body:'As próximas atividades da horta estão previstas para 22 e 29 de maio. O calendário cita a mesma manutenção.'}],finding:'O material simulado aponta uma pausa temporária, não o fechamento definitivo. Confira as datas e cite o aviso; não invente novos detalhes.'},{id:'quadra',title:'A foto da quadra',claim:'“A foto mostra a quadra da escola alagada hoje.”',brief:'Um print com uma fotografia está sendo compartilhado. Seu papel é esclarecer o que se sabe sem expor ninguém.',sources:[{type:'Publicação que circula',name:'Print sem autoria · hoje',body:'A imagem mostra uma quadra com água. A legenda diz “nossa escola agora”, mas a publicação não identifica o local nem informa a origem da foto.'},{type:'Origem da imagem · simulação',name:'Arquivo de um jornal local · 2023',body:'A mesma foto foi publicada em 2023 e identificada como a quadra de outra cidade. Ela não mostra a escola da turma.'},{type:'Fonte responsável · simulação',name:'Canal da escola · hoje',body:'Não há aviso sobre alagamento publicado até o momento da consulta. Ausência de aviso, sozinha, não prova que nada aconteceu.'}],finding:'A foto é antiga e de outro local; ela não comprova a legenda. Isso não basta para afirmar que nenhum alagamento ocorreu hoje.'},{id:'biblioteca',title:'O novo horário',claim:'“A biblioteca vai abrir aos sábados a partir do mês que vem.”',brief:'Um cartaz sobre a biblioteca apareceu no feed. Prepare uma publicação que deixe claro o que pode e o que não pode ser afirmado.',sources:[{type:'Publicação que circula',name:'Cartaz compartilhado · sem data',body:'“Biblioteca aos sábados! Começa no mês que vem!” O cartaz não informa autoria ou local de confirmação.'},{type:'Fonte responsável · simulação',name:'Biblioteca · mensagem desta semana',body:'“Estamos estudando a abertura aos sábados. Ainda não existe data definida; divulgaremos a decisão em nossos canais.”'},{type:'Outra evidência · simulação',name:'Calendário da biblioteca · esta semana',body:'O calendário disponível mostra atividades de segunda a sexta. Não registra início de atendimento aos sábados.'}],finding:'A abertura está em estudo e não há data confirmada. Não apresente um plano como decisão tomada.'}];
const GRADE_KEY='entre-linhas-v6-grade', base=()=>({games:{},draft:{caseId:'horta',headline:'',body:'',source:'',status:'',next:'',author:'',classroom:'',peer:'',revision:'',solution:''}});let grade=null,KEY='',state=base(),current='home',ephemeral=false,timer=null,pick=null;try{grade=Number(localStorage.getItem(GRADE_KEY))||null;if(![6,7,8,9].includes(grade))grade=null;if(grade){KEY='entre-linhas-v6-'+grade;const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.games&&saved.draft)state=saved}}catch(e){ephemeral=true}const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(!grade)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){ephemeral=true;let n=document.getElementById('save-note');if(n)n.textContent='O navegador não salvou seus dados. Baixe a entrega antes de sair.'}}function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function f(){return `<footer class="foot">Simulação educativa · Todos os casos são fictícios. Nada é publicado ou enviado automaticamente. <a href="https://getcloak.tech/second-source" target="_blank" rel="noopener noreferrer">Second Source</a> e <a href="https://getcloak.tech/swipe-to-survive" target="_blank" rel="noopener noreferrer">Swipe to Survive</a> foram referências de inspiração; projeto independente, sem vínculo.</footer>`}function render(html){app.innerHTML=html+f();document.getElementById('grade-label').textContent=grade?`Laboratório de informação · ${grade}º ano`:'Escolha seu ano';document.getElementById('grade-switch').hidden=!grade;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));window.scrollTo(0,0);app.focus({preventScroll:true})}function page(p){if(!grade&&p!=='home')p='home';if(timer){clearInterval(timer);timer=null}current=p;pick=null;if(p==='home')home();if(p==='learn')learn();if(p==='radar'||p==='feed')game(p);if(p==='studio')studio();if(p==='report')report()}
function chooseGrade(n){if(![6,7,8,9].includes(n))return;grade=n;KEY='entre-linhas-v6-'+n;state=base();try{localStorage.setItem(GRADE_KEY,String(n));let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.games&&saved.draft)state=saved}catch(e){ephemeral=true}page('home')}
function switchGrade(){if(!confirm('Trocar de ano? O progresso de cada ano fica salvo neste navegador, quando permitido.'))return;grade=null;state=base();KEY='';try{localStorage.removeItem(GRADE_KEY)}catch(e){ephemeral=true}page('home')}
function home(){if(!grade){render(`<section class="hero"><div class="label">Cultura maker · laboratório de informação</div><h1>Antes de publicar,<br>investigue.</h1><p>Escolha seu ano para começar. Você vai investigar mensagens e publicações e criar um post responsável.</p></section><div class="sectionhead"><div><div class="label">Comece por aqui</div><h2>Qual é o seu ano?</h2></div></div><div class="cards">${[6,7,8,9].map(n=>`<div class="card"><span class="tag">${n===6?'50 minutos':'100 minutos'}</span><h3>${n}º ano</h3><p>${{6:'Trilha curta, com exemplos e explicações simples.',7:'Privacidade, consequências e cuidado com outras pessoas.',8:'Investigação de mensagens, fontes e contexto.',9:'Evidências, escolhas digitais e soluções para a escola.'}[n]}</p><button class="btn primary" onclick="chooseGrade(${n})">Entrar no ${n}º ano →</button></div>`).join('')}</div><div class="info">Atividade simulada: nada é publicado nem enviado automaticamente. A escolha do ano pode ser alterada no topo.</div>`);return}let n=grade===6?4:12, disc=grade===6?'uma':'duas';let focus={6:'Comece com situações simples e descubra como conferir antes de acreditar.',7:'Pense também em privacidade e nos efeitos de cada escolha sobre outras pessoas.',8:'Compare o contexto, as fontes e o que as evidências realmente mostram.',9:'Avalie evidências, riscos e formas de melhorar a segurança da comunidade.'}[grade];let plan=grade===6?'5 min abertura · 6 min guia · 8 min radar · 10 min feed · 12 min criação · 6 min conversa · 3 min entrega':'5 min abertura · 10 min guia · 20 min radar · 30 min feed · 20 min criação · 10 min revisão · 5 min entrega';render(`<section class="hero"><div class="label">Cultura maker · ${grade}º ano</div><h1>Antes de publicar,<br>investigue.</h1><p>Nem tudo que aparece no feed conta a história inteira. Sua missão: analisar, conferir e criar uma publicação que ajude outras pessoas a entender.</p><button class="btn dark" onclick="page('learn')">Começar pelo guia →</button></section><div class="sectionhead"><div><div class="label">Sua jornada · ${grade===6?'50':'100'} minutos</div><h2>Da dúvida à publicação</h2></div></div><div class="info">${focus} Em cada módulo, você fará ${n} desafios e ${disc} ${grade===6?'questão discursiva':'questões discursivas'}.</div><div class="cards"><div class="card"><span class="tag">Módulo 01 · mensagens</span><h3>Radar de golpes</h3><p>Analise e-mails e conversas: nem todo recado é golpe.</p><button class="btn" onclick="page('radar')">Abrir o radar →</button></div><div class="card"><span class="tag blue">Módulo 02 · informação</span><h3>Feed em análise</h3><p>Investigue publicações, fontes e contexto antes de compartilhar.</p><button class="btn" onclick="page('feed')">Explorar o feed →</button></div></div><div class="sectionhead"><div><div class="label">Desafio maker</div><h2>Agora a redação é sua</h2></div></div><div class="card"><span class="tag gold">Criação + revisão</span><h3>Construa uma publicação responsável.</h3><p>Escolha um caso fictício, consulte as evidências e crie seu próprio post. A prévia não será publicada.</p><button class="btn primary" onclick="page('studio')">Entrar no estúdio →</button></div><details><summary>Professor(a): sugestão de aula e privacidade</summary><div class="inside"><p><strong>Roteiro sugerido:</strong> ${plan}.</p><p>Os desafios e as alternativas são distribuídos automaticamente; combinações podem coincidir. O tempo de leitura não comprova atenção. A checagem de texto identifica apenas padrões simples, não o sentido. Revise as respostas com a turma.</p><p>O site funciona offline; as situações e fontes são fictícias. O relatório é baixado pelo estudante e não é enviado automaticamente. Em dispositivos compartilhados, apague os dados após a entrega.</p></div></details>`)}
function learn(){if(grade===6){render(`<div class="heading"><div class="label">Guia rápido · 6 minutos</div><h1>Antes de clicar, pare e pense.</h1><p>Vamos aprender a cuidar dos nossos dados e a conferir informações.</p></div><div class="lessonlist"><div class="card lessonitem"><span class="icon">01</span><div><strong>O que estão pedindo?</strong><p>Senha, código e foto de documento são informações privadas. Não envie por mensagem.</p></div></div><div class="card lessonitem"><span class="icon">02</span><div><strong>Conhecer o nome não basta.</strong><p>Uma pessoa pode copiar foto ou nome. Se o pedido for inesperado, confirme com a pessoa por outro contato conhecido.</p></div></div><div class="card lessonitem"><span class="icon">03</span><div><strong>Confira antes de compartilhar.</strong><p>Uma foto ou muitas curtidas não provam uma notícia. Veja quem publicou, a data e o aviso original.</p></div></div><div class="card lessonitem"><span class="icon">04</span><div><strong>Nem todo recado é golpe.</strong><p>Compare o pedido com o que você já sabe. Se tiver dúvida, procure um adulto de confiança ou o canal conhecido da escola.</p></div></div></div><div class="actions"><button class="btn primary" onclick="page('radar')">Começar o radar →</button></div>`);return}render(`<div class="heading"><div class="label">Guia rápido · 10 minutos</div><h1>Uma pausa muda a história.</h1><p>Use estas perguntas para investigar — e volte a elas sempre que precisar.</p></div><div class="lessonlist"><div class="card lessonitem"><span class="icon">01</span><div><strong>Qual é a afirmação?</strong><p>Separe opinião de uma afirmação que pode ser verificada. “É a melhor biblioteca” é opinião; “abre sábado” é verificável, mas não necessariamente verdadeiro.</p></div></div><div class="card lessonitem"><span class="icon">02</span><div><strong>De onde veio e o que realmente diz?</strong><p>Procure autoria, data, local e material completo. Uma imagem real pode ser antiga ou acompanhar uma legenda errada. Uma captura de tela não substitui a origem.</p></div></div><div class="card lessonitem"><span class="icon">03</span><div><strong>Outras evidências confirmam?</strong><p>Vários perfis podem repetir a mesma fonte. Procure evidências independentes e adequadas ao assunto. Uma fonte oficial ou primária também pode errar; avalie o que ela de fato demonstra.</p></div></div><div class="card lessonitem"><span class="icon">04</span><div><strong>Não confirmado não significa falso.</strong><p>Se faltam dados, diga o que se sabe, o que falta e como verificar. Não compartilhe um boato como fato nem trate uma dúvida como mentira comprovada.</p></div></div><div class="card lessonitem"><span class="icon">05</span><div><strong>Uma mensagem pede ação imediata?</strong><p>Não envie senha ou código, nem faça pagamento pelo link recebido. Abra o canal oficial por conta própria; procure um adulto de confiança se precisar de ajuda.</p></div></div><div class="card lessonitem"><span class="icon">06</span><div><strong>Endereço bonito não prova identidade.</strong><p>Nome do contato, endereço de e-mail e site podem ser imitados. Verifique qual é o domínio, procure a origem e confira por um canal conhecido, aberto por você. Os endereços deste jogo terminam em .example e são apenas exemplos, sem links de acesso.</p></div></div></div><div class="info"><strong>Atalho de bolso:</strong> PARE → IDENTIFIQUE A AFIRMAÇÃO → PROCURE A ORIGEM → CONFIRA O CONTEXTO → ESCREVA COM RESPONSABILIDADE.</div><div class="actions"><button class="btn primary" onclick="page('radar')">Ir para o radar →</button><button class="btn" onclick="page('feed')">Ir para o feed →</button></div>`)}

olega conhecida não prova que a pessoa retratada autorizou a divulgação."},{"id":"r7x-06","module":"radar","stage":1,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um amigo envia link para uma votação do grêmio. O aviso no mural apresenta outro endereço e informa que o voto será presencial.","ask":"Como proceder?","options":["Checar o canal oficial fora do link","Votar no link e mostrar o resultado","Encaminhar o link para os colegas"],"correct":0,"why":"A divergência entre canais é um sinal para checar por um caminho independente. O perfil conhecido pode ter sido copiado."},{"id":"r7x-07","module":"radar","stage":2,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um aplicativo pede acesso aos contatos para exibir um calendário. Essa função não exige contatos e o pedido não explica seu uso.","ask":"Que decisão é mais cuidadosa?","options":["Negar o acesso e avaliar a função","Autorizar para abrir o calendário","Enviar os contatos ao suporte"],"correct":0,"why":"A permissão parece desnecessária para a finalidade descrita; negar e avaliar o serviço reduz exposição."},{"id":"r7x-08","module":"radar","stage":2,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Uma publicação promete material escolar grátis, mas exige foto do documento e senha da conta.","ask":"Qual resposta é mais segura?","options":["Não enviar dados e avisar um adulto","Enviar somente a foto do documento","Enviar somente a senha da conta"],"correct":0,"why":"Uma promessa de brinde não justifica coletar senha ou documentos por mensagem."},{"id":"r7x-09","module":"radar","stage":2,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"A professora explicou em sala que enviaria um arquivo. Uma mensagem em nome dela traz um arquivo com extensão inesperada e pede execução imediata.","ask":"Como agir antes de abrir?","options":["Confirmar a mensagem por outro canal","Executar o arquivo para testar logo","Repassar o arquivo para a turma"],"correct":0,"why":"O contexto esperado não autentica todo anexo. Confirme por outro canal antes de abri-lo."},{"id":"r7x-10","module":"radar","stage":3,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um colega publica foto de um bilhete seu. Você não autorizou e outras pessoas começaram a comentar.","ask":"Qual resposta é mais responsável?","options":["Pedir retirada e buscar apoio adulto","Repostar o bilhete para se defender","Divulgar dados de quem publicou"],"correct":0,"why":"Pedir a retirada e buscar apoio evita aumentar a exposição ou responder com outra violação."},{"id":"r7x-11","module":"radar","stage":3,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Você quer registrar uma visita da turma e uma pessoa diz que não quer aparecer.","ask":"Como respeitar a escolha?","options":["Fazer imagem sem essa pessoa","Postar primeiro e perguntar depois","Deixar a pessoa no fundo da imagem"],"correct":0,"why":"Mesmo ao fundo, uma pessoa pode ser identificada. Combine uma alternativa antes da foto."},{"id":"r7x-12","module":"radar","stage":3,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um serviço pede nome completo, endereço e senha para participar de uma enquete sobre livros.","ask":"O que fazer com o formulário?","options":["Não preencher e confirmar a origem","Preencher apenas a senha e o nome","Encaminhar o formulário ao grupo"],"correct":0,"why":"Senha não é necessária para uma enquete; confirme a origem por canal independente e evite divulgar o formulário."}],"radar9":[{"id":"r9x-01","module":"radar","stage":0,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um aviso sobre inscrição pede foto de documento para uma lista de presença. O canal é conhecido, mas o motivo para o documento não é explicado.","ask":"Que resposta combina segurança e participação?","options":["Questionar a necessidade pelo canal oficial","Enviar o documento e perguntar depois","Publicar o pedido para toda a turma"],"correct":0,"why":"Um canal conhecido não elimina a necessidade de justificar coleta. Peça esclarecimento pelo canal oficial e minimize dados."},{"id":"r9x-02","module":"radar","stage":0,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"A equipe percebe que um link de cadastro foi enviado de uma conta escolar comprometida. Algumas pessoas já abriram a página.","ask":"Qual é a primeira resposta mais adequada?","options":["Avisar responsáveis pelo canal seguro","Reenviar o link para testar com colegas","Apagar as mensagens sem avisar ninguém"],"correct":0,"why":"Informe rapidamente a equipe responsável por um canal independente; não espalhe o link nem peça que outros o testem."},{"id":"r9x-03","module":"radar","stage":0,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um serviço solicita acesso permanente aos contatos para enviar um único lembrete de evento. Ele oferece também convite por código sem contatos.","ask":"Qual decisão é proporcional?","options":["Usar o código sem liberar os contatos","Liberar os contatos sem verificar uso","Enviar a lista inteira ao organizador"],"correct":0,"why":"Quando uma alternativa menos invasiva funciona, prefira coletar e compartilhar menos dados."},{"id":"r9x-04","module":"radar","stage":1,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um pedido de Pix chega do número habitual de uma pessoa. No entanto, a linguagem é incomum e há pressão para não ligar.","ask":"Como equilibrar cuidado e apoio?","options":["Ligar pelo contato conhecido antes de agir","Transferir e pedir explicação em seguida","Ignorar o pedido e divulgar a conversa"],"correct":0,"why":"Conta conhecida pode ser invadida. Confirme a identidade por canal independente antes de qualquer transferência."},{"id":"r9x-05","module":"radar","stage":1,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Uma escola quer alertar sobre um golpe usando uma captura real que mostra telefone e foto da vítima.","ask":"Qual medida protege melhor a vítima?","options":["Criar exemplo fictício sem dados reais","Publicar a captura para aumentar o alcance","Manter a foto e apagar só o telefone"],"correct":0,"why":"Exemplos fictícios ajudam a ensinar sem expor a vítima; remover somente um dado não garante anonimato."},{"id":"r9x-06","module":"radar","stage":1,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"A equipe quer registrar incidentes digitais da turma para melhorar a prevenção.","ask":"Qual registro faz mais sentido?","options":["Anotar padrão e ação sem dados sensíveis","Guardar senhas para investigar as contas","Compartilhar nomes e prints publicamente"],"correct":0,"why":"Registre apenas o necessário, sem credenciais nem exposição, e encaminhe incidentes ao responsável apropriado."},{"id":"r9x-07","module":"radar","stage":2,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Uma conta oferece um benefício escolar e pede que estudantes informem código de acesso. O perfil se parece com o oficial.","ask":"Qual plano reduz o risco imediato?","options":["Não informar códigos e avisar a escola","Solicitar os códigos para testar o perfil","Divulgar códigos vencidos no grupo"],"correct":0,"why":"Códigos são privados mesmo quando o perfil parece legítimo. Avise a escola sem repassar credenciais."},{"id":"r9x-08","module":"radar","stage":2,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Depois de clicar em um link suspeito, uma pessoa informa sua senha. Ela ainda consegue acessar a conta.","ask":"Qual sequência é mais útil?","options":["Trocar a senha e buscar apoio no serviço","Enviar a senha antiga para os colegas","Apenas fechar a aba e não contar a ninguém"],"correct":0,"why":"Use o serviço oficial para trocar a senha, encerrar sessões se possível e procurar apoio. Não compartilhe a senha."},{"id":"r9x-09","module":"radar","stage":2,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Dois formulários cumprem a mesma tarefa. Um pede nome e turma; outro pede também endereço, documentos e senha.","ask":"Qual critério orienta a escolha?","options":["Coletar só dados necessários ao objetivo","Escolher o formulário com mais campos","Escolher pelo visual mais profissional"],"correct":0,"why":"Minimização e finalidade importam mais que aparência. Nunca forneça senha para um formulário comum."},{"id":"r9x-10","module":"radar","stage":3,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Uma pessoa informa que uma conta está se passando por ela. O grupo pretende responder com ofensas e compartilhar o número.","ask":"Qual plano evita ampliar o dano?","options":["Guardar evidências e procurar apoio","Expor o número em grupos da escola","Enviar insultos para a conta suspeita"],"correct":0,"why":"Registre evidências de modo restrito e peça apoio ou denuncie pelo canal oficial, sem expor dados."},{"id":"r9x-11","module":"radar","stage":3,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Uma ferramenta de publicação mostra nomes de estudantes por padrão. A turma quer divulgar resultados de uma pesquisa.","ask":"Qual mudança é mais adequada?","options":["Apresentar resultados sem identificar pessoas","Publicar a planilha com nomes completos","Pedir senhas para corrigir os nomes"],"correct":0,"why":"Resultados agregados ajudam a comunicar sem expor participantes; reveja também se grupos pequenos podem identificá-los."},{"id":"r9x-12","module":"radar","stage":3,"type":"case","tag":"Decisão responsável","who":"Situação da turma","text":"Um e-mail parece vir da biblioteca e pede pagamento urgente. Você não tem certeza se existe uma multa.","ask":"Qual procedimento permite conferir?","options":["Abrir o serviço conhecido por conta própria","Pagar pelo botão recebido e pedir estorno","Responder ao remetente co ue ninguém lê"],"correct":0,"why":"O grupo pesquisado limita o alcance da conclusão.","engagement":"230 reações"},{"id":"s7x-08","module":"feed","type":"socialtext","tag":"Análise de evidências","who":"mural_da_comunidade","text":"Um aviso sobre chuva atribui uma previsão a uma instituição.","evidence":"A previsão mostrada foi publicada há três semanas e valeu para outra cidade.","ask":"Qual conclusão respeita melhor as evidências?","options":["A previsão não confirma este aviso","A previsão confirma o tempo de hoje","A previsão vale em qualquer lugar"],"correct":0,"why":"Data e lugar são parte essencial do contexto de uma previsão.","engagement":"230 reações"}],"social9":[{"id":"s9x-01","module":"feed","type":"socialdeep","tag":"Análise de evidências","who":"mural_da_comunidade","text":"“Três portais confirmaram que o parque fechará.”","evidence":"Os três portais citam o mesmo post anônimo; não há comunicado do responsável.","ask":"Qual conclusão respeita melhor as evidências?","options":["Os portais repetem uma origem não confirmada","Três publicações provam fontes independentes","O silêncio prova que o parque ficará aberto"],"correct":0,"why":"Três textos podem depender de uma única origem. A ausência de comunicado também não prova que nada ocorrerá.","engagement":"230 reações"},{"id":"s9x-02","module":"feed","type":"socialdeep","tag":"Análise de evidências","who":"mural_da_comunidade","text":"“O novo horário melhorou todas as notas”, diz um gráfico.","evidence":"A amostra inclui uma turma, sem comparação com períodos anteriores ou outras turmas.","ask":"Qual conclusão respeita melhor as evidências?","options":["O gráfico não demonstra causa geral","O gráfico prova a causa para todos","A amostra prova que nenhuma nota mudou"],"correct":0,"why":"Uma amostra limitada e sem comparação não demonstra causalidade nem permite generalizar.","engagement":"230 reações"},{"id":"s9x-03","module":"feed","type":"socialdeep","tag":"Análise de evidências","who":"mural_da_comunid function startReading(k,required){let g=state.games[k],d=g.deck[g.pos],q=byId(d.id),a=g.answers[g.pos],last=Date.now(),saved=0;const update=()=>{let note=document.getElementById('reading-msg');if(!note)return;let need=a?(a.ok?0:7000):required,elapsed=a?(d.review||0):(d.read||0),seconds=Math.max(0,Math.ceil((need-elapsed)/1000)),hasSource=!!q.evidence,sourceWait=hasSource?Math.max(0,Math.ceil((8000-(d.evidenceRead||0))/1000)):0,done=seconds===0&&(!hasSource||a||d.evidenceOpen&&sourceWait===0);if(a){note.innerHTML=done?'<span class="tick">✓</span> Você já pode continuar.':`<span class="tick">◷</span> Leia a explicação: continue em ${seconds} s.`;document.getElementById('nextBtn').disabled=!done}else{note.innerHTML=done?'<span class="tick">✓</span> Tempo de leitura cumprido. Faça sua escolha.':hasSource&&!d.evidenceOpen?'<span class="tick">◷</span> Abra a fonte simulada para investigar antes de escolher.':hasSource&&sourceWait>0?`<span class="tick">◷</span> Leia a fonte e o cenário: escolha em ${Math.max(seconds,sourceWait)} s.`:`<span class="tick">◷</span> Leia o cenário e as opções: escolha em ${seconds} s.`;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=!done);document.getElementById('revealBtn').disabled=!(done&&pick!==null)}};update();timer=setInterval(()=>{let now=Date.now(),delta=Math.min(1200,Math.max(0,now-last));last=now;if(current!==k||document.visibilityState!=='visible')return;if(a){d.review=Math.min(7000,(d.review||0)+delta)}else{d.read=Math.min(required,(d.read||0)+delta);if(q.evidence&&d.evidenceOpen)d.evidenceRead=Math.min(8000,(d.evidenceRead||0)+delta)}saved+=delta;if(saved>=1000){save();saved=0}update()},300)}
function selectChoice(k,n){let g=state.games[k],d=g.deck[g.pos],q=byId(d.id);if(g.answers[g.pos]||d.read<limitFor(q)||(q.evidence&&(!d.evidenceOpen||(d.evidenceRead||0)<8000)))return;pick=n;document.querySelectorAll('[data-choice]').forEach(b=>{let sel=Number(b.dataset.choice)===n;b.classList.toggle('selected',sel);b.setAttribute('aria-pressed',String(sel))});document.getElementById('revealBtn').disabled=false}

function textCheck(value,minWords,minChars){let t=(value||'').trim().toLowerCase(),words=t.match(/[a-zà-öø-ÿ]+/giu)||[];if(t.length<minChars||words.length<minWords)return `Escreva pelo menos ${minWords} palavras e ${minChars} caracteres.`;if(/(.)\1{3,}/u.test(t)||/(?:asdfgh|qwerty|zxcvbn|abcdef|123456)/i.test(t))return 'Evite sequências de teclas ou letras repetidas.';let meaningful=words.filter(w=>w.length>1),unique=new Set(meaningful);if(meaningful.length>=4&&unique.size/meaningful.length<0.6)return 'Evite repetir as mesmas palavras; escreva uma frase completa.';let improbable=meaningful.filter(w=>!/[aeiouáéíóúâêôãõü]/i.test(w)||/[bcdfghjklmnpqrstvwxyz]{5,}/i.test(w)).length;if(meaningful.length&&improbable/meaningful.length>0.28)return 'Algumas palavras parecem incompletas. Revise a escrita e tente novamente.';return ''}

function report(){const d=state.draft,c=caseNow(),problems=validateDraft(),pending=missionPending(),complete=!problems.length&&!pending.length;let totals=['radar','feed'].map(k=>{let g=state.games[k];return g?`${k==='radar'?'Radar de golpes':'Feed em análise'}: ${g.answers.length}/${g.deck.length} respondidos; ${g.answers.filter(x=>x.ok).length} escolhas adequadas.`:`${k==='radar'?'Radar de golpes':'Feed em análise'}: ainda não iniciado.`});render(`<div class="heading"><div class="label">Última etapa · entrega</div><h1>Revise sua jornada.</h1><p>Confira o percurso e sua publicação. O arquivo reúne suas escolhas e o post para entregar pelo canal indicado pelo professor.</p></div><div class="info ${complete?'':'warning'}"><strong>${complete?'Atividades e campos necessários foram preenchidos.':'A entrega ainda não está pronta.'}</strong> ${complete?'O filtro não corrige o conteúdo: confira a fonte e as evidências antes de entregar.':'Conclua os dois módulos e revise os campos indicados para liberar o download.'}</div>${!complete?`<div class="writeerrors"><strong>O que revisar:</strong><ul>${pending.map(k=>`<li>Conclua ${k==='radar'?'o Radar de golpes':'o Feed em análise'}.</li>`).join('')}${problems.map(p=>`<li>${esc(p.msg)}</li>`).join('')}</ul><p class="help">O filtro detecta alguns padrões simples; ele não garante sentido nem correção e pode rejeitar textos válidos. Peça ajuda ao professor se necessário.</p></div>`:''}<div class="cards"><div class="card"><span class="tag">Seu percurso</span><h3>Missões</h3>${totals.map(x=>`<p>${esc(x)}</p>`).join('')}<p class="small">As combinações de desafios podem se repetir entre alunos. A pontuação apoia a aprendizagem.</p></div><div class="card"><span class="tag gold">Sua publicação</span><h3>${esc(c.title)}</h3><p><strong>Título:</strong> ${esc(d.headline||'Não preenchido')}</p><p><strong>Situação:</strong> ${esc(d.status||(grade===6?'Não necessária nesta trilha':'Não selecionada'))}</p><button class="btn" onclick="page('studio')">Editar publicação →</button></div></div><details><summary>Ver meu post e a revisão</summary><div class="inside"><p><strong>Texto:</strong> ${esc(d.body||'Não preenchido')}</p><p><strong>Fonte e data:</strong> ${esc(d.source||'Não preenchido')}</p><p><strong>Como conferir:</strong> ${esc(d.next||'Não preenchido')}</p><p><strong>Sugestão da outra dupla:</strong> ${esc(d.peer||'Não registrada')}</p><p><strong>Revisão:</strong> ${esc(d.revision||'Não registrada')}</p>${grade===9?`<p><strong>Solução e teste:</strong> ${esc(d.solution||'Não registrada')}</p>`:''}</div></details><details><summary>Rever respostas e explicações dos desafios</summary><div class="inside">${['radar','feed'].map(k=>{let g=state.games[k];if(!g||!g.answers.length)return `<h3>${k==='radar'?'Radar de golpes':'Feed em análise'}</h3><p>Nenhuma resposta registrada.</p>`;return `<h3>${k==='radar'?'Radar de golpes':'Feed em análise'}</h3>`+g.answers.map((a,i)=>{let q=byId(a.id);return `<div style="border-top:1px solid #d5e1df;padding:12px 0"><strong>${i+1}. ${esc(q.ask)}</strong>${q.premise?`<p><strong>Contexto:</strong> ${esc(q.premise)}<br><strong>De/contato:</strong> ${esc(q.address)}<br><strong>Assunto:</strong> ${esc(q.subject)}</p>`:''}<p>${esc(q.text)}</p>${q.evidence?`<p><strong>Fonte simulada:</strong> ${esc(q.evidence)}</p>`:''}<p>Sua escolha: ${esc(optText(q.options[a.choice]))} · ${a.ok?'adequada':'para revisar'}</p><p>Orientação: ${esc(optText(q.options[q.correct]))}</p><p>${esc(q.why)}</p></div>`}).join('')}).join('')}</div></details><details><summary>Rever questões discursivas</summary><div class="inside">${['radar','feed'].map(k=>{let g=state.games[k];return `<h3>${k==='radar'?'Radar de golpes':'Feed em análise'}</h3>`+(g?g.discussions.map((d,i)=>`<p><strong>${i+1}. ${esc(d.prompt)}</strong><br>Resposta: ${esc(d.response||'Não registrada')} · ${d.submitted?'concluída':'pendente'}</p>`).join(''):'<p>Módulo ainda não iniciado.</p>')}).join('')}</div></details><div class="card"><h3>Identificação e entrega</h3><p>Use apenas o código ou apelido combinado com o professor e a turma. Evite dados pessoais sensíveis.</p><label for="author">Apelido ou código (opcional)</label><input id="author" maxlength="60" autocomplete="off" value="${esc(d.author)}" oninput="draft('author',this.value)"><label for="classroom">Turma (opcional)</label><input id="classroom" maxlength="30" autocomplete="off" placeholder="Ex.: ${grade}º A" value="${esc(d.classroom)}" oninput="draft('classroom',this.value)"><div class="info">O relatório é editável e <strong>não é enviado automaticamente</strong>. Ele não comprova a identidade. Entregue-o pelo canal definido pelo professor.</div><p id="save-note" class="help">${ephemeral?'O navegador pode não guardar os dados. Baixe a entrega antes de sair.':'O progresso é salvo neste navegador, quando permitido. Em computador compartilhado, apague os dados depois de baixar.'}</p><div class="actions"><button class="btn primary" onclick="download()" ${complete?'':'disabled'}>↓ Baixar atividade (.txt)</button><button class="btn" onclick="printReport()" ${complete?'':'disabled'}>Imprimir / salvar PDF</button><button class="btn" onclick="clearAll()">Apagar dados deste dispositivo</button></div></div>`)}
function textReport(){let d=state.draft,c=caseNow();let lines=['ENTRE LINHAS — ATIVIDADE DO '+grade+'º ANO','Identificação: '+(d.author||'não informada'),'Turma: '+(d.classroom||'não informada'),'Gerado em: '+new Date().toLocaleString('pt-BR'),'','PERCURSO'];for(let k of ['radar','feed']){let g=state.games[k];lines.push('\n'+(k==='radar'?'RADAR DE GOLPES':'FEED EM ANÁLISE'));if(!g||!g.answers.length){lines.push('Nenhuma resposta registrada.');continue}lines.push(`${g.answers.length}/${g.deck.length} respondidos; ${g.answers.filter(a=>a.ok).length} adequadas.`);g.answers.forEach((a,i)=>{let q=byId(a.id),order=g.deck[i].order;lines.push('\n'+(i+1)+'. ['+q.id+'] '+q.text,...(q.premise?['Contexto: '+q.premise,'De/contato: '+q.address,'Assunto: '+q.subject]:[]),...(q.evidence?['Fonte simulada: '+q.evidence]:[]),q.ask,'Alternativas apresentadas:',...order.map((n,j)=>`${j+1}. ${optText(q.options[n])}`),'Escolha: '+optText(q.options[a.choice]),'Orientação: '+optText(q.options[q.correct]),'Explicação: '+q.why)});g.discussions.forEach((entry,i)=>lines.push('\nQUESTÃO DISCURSIVA '+(i+1),entry.prompt,'Resposta: '+(entry.response||'não registrada'),'Situação: '+(entry.submitted?'concluída':'pendente')))}lines.push('\nESTÚDIO DE PUBLICAÇÃO','Caso: '+c.title,'Afirmação: '+c.claim,'Título: '+(d.headline||'não preenchido'),'Situação: '+(d.status||'não selecionada'),'Texto: '+(d.body||'não preenchido'),'Fonte e data: '+(d.source||'não preenchido'),'Como conferir: '+(d.next||'não preenchido'),'Sugestão recebida: '+(d.peer||'não registrada'),'Mudança ou decisão: '+(d.revision||'não registrada'),...(grade===9?['Solução e teste: '+(d.solution||'não registrada')]:[]),'','Todos os casos são fictícios; nada foi publicado ou enviado automaticamente. Este arquivo é editável e não autentica identidade.');return lines.join('\n')}
function printReport(){if(validateDraft().length||missionPending().length)return;document.querySelectorAll('details').forEach(d=>d.open=true);window.print()}

function download(){if(validateDraft().length||missionPending().length){page('report');return}let blob=new Blob(['\ufeff'+textReport()],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='entre-linhas-atividade-'+grade+'ano.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function clearAll(){if(!confirm('Apagar as atividades de todos os anos neste navegador? Baixe antes de apagar.'))return;try{[6,7,8,9].forEach(n=>localStorage.removeItem('entre-linhas-v6-'+n));localStorage.removeItem(GRADE_KEY)}catch(e){}grade=null;KEY='';state=base();page('home')}page('home');
</script></body></html>
